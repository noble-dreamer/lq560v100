;;;;;;;vi;;;;;;;
;; the dev id of sensor
vi_dev_id                          = "2"
;;;;;;vproc;;;;;
;; the src_frame_rate of vproc chn
vproc_chn_frc_src                  = "50, 25, 25, 25"
;; the dst_frame_rate of vproc chn
vproc_chn_frc_dst                  = "50, 25, 25, 25"
;; the size of vproc chn
vproc_chn_img_w                    = "1920, 1920, 1920, 448"
vproc_chn_img_h                    = "1080,  1080, 1080, 384"
;; 0: ABS; 1: RATIO
vproc_chn_crop_mode                = "0, 0, 0, 0"
vproc_chn_crop_x                   = "0, 0, 0, 0"
vproc_chn_crop_y                   = "0, 0, 0, 0"
vproc_chn_crop_w                   = "0, 0, 0, 0"
vproc_chn_crop_h                   = "0, 0, 0, 0"
;; 0: 0 degree; 1: 90 degrees; 2: 180 degrees; 3: 270 degrees
vproc_chn_rotation                 = "0, 0, 0, 0"
;;;;;;;venc;;;;;
;; the chn id of vproc to be saved
venc_chn_id                        = "1"
;; 0: HEVC; 1: H264; 2:JPEG;
venc_codec_format                  = "0"
venc_stream_buf_size               = "6220800"
venc_gop                           = "25"
venc_rc_mode                       = "0"
venc_statis_time                   = "1"
venc_max_bit_rate                  = "40960"
venc_short_statis_time             = "1"
venc_long_statis_time              = "1"
venc_long_max_bit_rate             = "30720"
venc_long_min_bit_rate             = "20480"
venc_gop_mode                      = "0"
venc_qp_delta_ip                   = "2"
venc_max_file_size_m               = "250"
;;;;;;;compress;;;;;
;; 0:NONE, 1:SEG, 2:LINE, 3:FRAME
comp_mode_vi_pipe                  = "0"
comp_mode_vi_chn                   = "0"
comp_mode_vproc_pipe               = "0, 0, 0, 0"
comp_mode_vproc_chn                = "0, 0, 0, 0"
comp_mode_3dnr                     = "0"
;;;;;;;;;;;;;;mce_parameter;;;;;;;;;;;;;;
[mce_1]
;; the id of vproc chn frame pool to send to mce
